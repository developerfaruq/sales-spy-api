        example: spend
        type: string
        enumValues:
          - opening_balance
          - subscription_grant
          - monthly_reset
          - spend
          - refund
          - admin_adjustment
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      from:
        custom: []
        name: from
        description: 'Include transactions on or after this date (YYYY-MM-DD). Must be a valid date in the format <code>Y-m-d</code>.'
