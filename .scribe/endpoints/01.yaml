  -
    custom: []
    httpMethods:
      - DELETE
    uri: 'api/v1/admin/plans/{planId}'
    metadata:
      custom: []
      groupName: 'Admin — Plans'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Delete a plan'
      description: |-
        Refused with 409 when the plan is the free plan, or when any subscription
        or payment order references it — deleting those would break registration or
        orphan billing history. Deactivate the plan instead, which hides it from
        the public list without affecting existing subscribers.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      planId:
        custom: []
        name: planId
        description: 'The plan id.'
        required: true
        example: 5
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      planId: 5
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: '{"success": true, "message": "Plan deleted successfully", "data": null}'
        headers: []
        description: ''
      -
        custom: []
        status: 404
        content: '{"success": false, "message": "Plan not found.", "errors": null}'
        headers: []
        description: ''
      -
        custom: []
        status: 409
        content: |-
          {
            "success": false,
            "message": "This plan still has subscriptions. Deactivate it instead so existing subscribers are unaffected.",
            "errors": null
