        required: false
        example: 12
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      monthly_quota:
        custom: []
        name: monthly_quota
        description: 'Must be at least -1.'
        required: false
        example: 59
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      access_rank:
        custom: []
