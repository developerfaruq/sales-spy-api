    uri: 'api/v1/admin/plans/{planId}'
    metadata:
      custom: []
      groupName: 'Admin — Plans'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Update a plan'
      description: |-
        Send only the fields you want to change.

        Changing `monthly_quota` does not alter what current subscribers already
        hold — their balance was granted when they subscribed and is recalculated
        on their next monthly reset. The free plan's slug cannot be changed because
        registration resolves it by slug.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      planId:
        custom: []
        name: planId
        description: 'The plan id.'
        required: true
        example: 2
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      planId: 2
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      slug:
        custom: []
        name: slug
        description: 'Must match the regex /^[a-z][a-z0-9-]*$/. Must not be greater than 32 characters.'
        required: false
        example: b
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      name:
        custom: []
        name: name
        description: 'Must not be greater than 100 characters.'
        required: false
        example: 'n'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      monthly_price:
