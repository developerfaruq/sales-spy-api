  -
    custom: []
    httpMethods:
      - POST
    uri: api/v1/admin/plans
    metadata:
      custom: []
      groupName: 'Admin — Plans'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Create a plan'
      description: |-
        `access_rank` decides what lead data the tier unlocks: 0 unlocks nothing
        beyond basic listings, 1 unlocks contacts and products, 2 unlocks deep
        scans. If omitted it defaults by slug for the four built-in tiers, and to 0
        for any new slug — so set it explicitly on a new paid tier or subscribers
        will get free-tier access.
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_AUTH_TOKEN}'
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      slug:
        custom: []
        name: slug
        description: 'Unique plan identifier. Must match the regex /^[a-z][a-z0-9-]*$/. Must not be greater than 32 characters.'
        required: true
        example: growth
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      name:
        custom: []
        name: name
        description: 'Display name. Must not be greater than 100 characters.'
        required: true
        example: Growth
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      monthly_price:
        custom: []
        name: monthly_price
        description: 'Monthly price in cents. Must be at least 0.'
        required: true
        example: 4900
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      yearly_price:
        custom: []
        name: yearly_price
        description: 'Yearly price in cents. Must be at least 0.'
        required: true
        example: 49000
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      monthly_quota:
        custom: []
        name: monthly_quota
        description: 'Monthly credits, or -1 for unlimited. Must be at least -1.'
        required: true
        example: 1000
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      access_rank:
        custom: []
        name: access_rank
        description: 'Lead access tier. 0 = no contacts or products, 1 = contacts and products, 2 = deep scans. Defaults by slug, or 0 for a new slug. Must be at least 0. Must not be greater than 255.'
        required: false
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      features:
        custom: []
        name: features
        description: 'Must not be greater than 255 characters.'
        required: false
        example:
          - b
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      is_active:
        custom: []
        name: is_active
        description: 'Whether the plan is publicly listed.'
        required: false
        example: true
        type: boolean
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      sort_order:
        custom: []
        name: sort_order
        description: 'Display order, ascending. Must be at least 0.'
        required: false
        example: 2
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      slug: growth
      name: Growth
      monthly_price: 4900
      yearly_price: 49000
      monthly_quota: 1000
      access_rank: 1
      features:
        - b
      is_active: true
      sort_order: 2
    fileParameters: []
